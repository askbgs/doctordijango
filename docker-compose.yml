# Local development stack for WhatsApp AI Sales Agent
# Supabase is used as an external hosted service - configure via .env
# This compose file provides n8n for workflow development

services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-for-production}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Colombo
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
